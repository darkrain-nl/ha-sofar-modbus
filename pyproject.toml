[project]
name = "ha-sofar-modbus"
version = "0.1.0"
description = "Sofar inverter HACS integration for Home Assistant, built on modbus-connection"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "modbus-connection[tmodbus]>=4.8.1,<5.0.0",
    "sofar-modbus>=0.1.11,<0.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "mypy>=1.8.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-homeassistant-custom-component",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pycares<4.11.1",
]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.13"
show_error_codes = true
follow_imports = "normal"
local_partial_types = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "pytest_homeassistant_custom_component.*",
]
ignore_missing_imports = true
